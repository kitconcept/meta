name: Container Image Generation

on:
  workflow_call:
    inputs:
      base-tag:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      image-name-prefix:
        required: true
        type: string
      image-name-suffix:
        required: true
        type: string
      platforms:
        required: false
        default: "linux/amd64"
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      registry:
        required: false
        default: "ghcr.io"
        type: string
      build-args:
        required: false
        default: ""
        type: string
      push:
        required: true
        type: boolean
    secrets:
        username:
            required: true
        password:
            required: true

jobs:

  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.vars.outputs.platforms }}
      image_name: ${{ steps.vars.outputs.image_name }}

    steps:

      - name: Compute several vars needed for the CI
        id: vars
        shell: bash
        run: |
          platforms=${{ inputs.platforms }}
          # Split platforms into an array (by comma)
          # and then, for each platform, create a matrix entry with the platform
          # and the corresponding runner
          IFS=',' read -r -a platform_array <<< "$platforms"
          matrix='['
          first=true

          for raw_platform in "${platform_array[@]}"; do
            platform="${raw_platform//[[:space:]]/}"
            [ -z "$platform" ] && continue

            case "$platform" in
              linux/amd64)
                runner="ubuntu-latest"
                ;;
              linux/arm64)
                runner="ubuntu-24.04-arm"
                ;;
              *)
                echo "Unsupported platform: $platform" >&2
                exit 1
                ;;
            esac

            if [ "$first" = true ]; then
              first=false
            else
              matrix+=','
            fi

            matrix+="{\"platform\":\"$platform\",\"runner\":\"$runner\"}"
          done

          matrix+=']'

          if [ "$matrix" = "[]" ]; then
            echo "No valid platforms were provided." >&2
            exit 1
          fi

          echo "platforms=$matrix" >> "$GITHUB_OUTPUT"
          echo "image_name=${{ inputs.image-name-prefix }}-${{ inputs.image-name-suffix }}" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - config
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        id: vars
        run: |
          platform=${{ matrix.platform }}
          echo "platform_pair=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ needs.config.outputs.image_name }}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context:  ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ needs.config.outputs.image_name }}
          outputs: ${{ inputs.push && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=docker' }}

      - name: Export digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.vars.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "Image ${{ needs.config.outputs.image_name }}:${{ inputs.base-tag }}"
    needs:
      - config
      - build
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ needs.config.outputs.image_name }}
          flavor:
            latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ inputs.base-tag }}
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.config.outputs.image_name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ needs.config.outputs.image_name }}:${{ steps.meta.outputs.version }}
