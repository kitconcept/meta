name: "Backend: Test Python codebase"

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      plone-version:
        required: true
        type: string
      working-directory:
        required: false
        default: backend
        type: string

jobs:

  deprecation-notice:
    name: Deprecated
    runs-on: ubuntu-latest
    steps:
      - name: Report deprecation
        run: |
          MESSAGE="This workflow is deprecated and will be removed. Use plone/meta/.github/workflows/backend-pytest.yml@2.x instead."
          echo "::warning title=Deprecated workflow::${MESSAGE}"
          {
            echo "> [!WARNING]"
            echo "> ${MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs.python-version }}
      PLONE_VERSION: ${{ inputs.plone-version }}
    steps:

        - name: Checkout
          uses: actions/checkout@v7

        - name: Setup Backend
          uses: kitconcept/meta/.github/actions/setup_backend@main
          with:
            python-version: ${{ inputs.python-version }}
            plone-version: ${{ inputs.plone-version }}
            working-directory: ${{ inputs.working-directory }}

        - name: Run tests
          working-directory: ${{ inputs.working-directory }}
          run: make test
