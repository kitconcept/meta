name: 'Plone Monorepo: Setup Backend'
description: 'Setup backend codebase of a monorepo project based on Plone'
inputs:
  python-version:
    description: 'Python Version'
    required: true
    default: '3.14'
  plone-version:
    description: 'Plone Version'
    required: true
    default: '6.2.1'
  working-directory:
    description: 'Working directory to use'
    required: false
    default: 'backend'
runs:
  using: "composite"
  steps:
    - name: Report deprecation
      shell: bash
      run: |
        MESSAGE="This action is deprecated and will be removed. Use plone/meta/.github/actions/setup_backend_uv@2.x instead."
        echo "::warning title=Deprecated action::${MESSAGE}"
        {
          echo "> [!WARNING]"
          echo "> ${MESSAGE}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: false

    - name: Restore uv cache
      uses: actions/cache@v6
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.plone-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.plone-version }}-${{ hashFiles('pyproject.toml') }}
          uv-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.plone-version }}

    - name: Install Plone and package
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: make install
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        PLONE_VERSION: ${{ inputs.plone-version }}
