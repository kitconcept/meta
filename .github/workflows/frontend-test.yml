name: "Frontend: Test codebase"

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      working-directory:
        required: false
        default: frontend
        type: string

jobs:

  deprecation-notice:
    name: Deprecated
    runs-on: ubuntu-latest
    steps:
      - name: Report deprecation
        run: |
          MESSAGE="This workflow is deprecated and will be removed. Use plone/meta/.github/workflows/frontend-unit.yml@2.x instead."
          echo "::warning title=Deprecated workflow::${MESSAGE}"
          {
            echo "> [!WARNING]"
            echo "> ${MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"
  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Setup Frontend
        uses: kitconcept/meta/.github/actions/setup_frontend@main
        with:
            node-version: ${{ inputs.node-version }}
            working-directory: ${{ inputs.working-directory }}

      - name: Tests
        id: test
        working-directory: ${{ inputs.working-directory }}
        run: make test
